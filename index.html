<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasir Kedai Rona</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#20243a;--muted:#73798d;--brand:#5b5bd6;--line:#e8e9f1;--danger:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;min-height:44px;background:var(--brand);color:white;font-weight:650}button.secondary{background:#eeefff;color:var(--brand)}button.danger{background:#fff0ee;color:var(--danger)}button:disabled{opacity:.45;cursor:not-allowed}input,select{width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:12px;color:var(--ink);min-height:44px}label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}.wrap{max-width:1050px;margin:auto;padding:16px 16px 92px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{background:#e8e8ff;border-radius:14px;padding:10px;font-size:25px}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button{white-space:nowrap;background:#e9eaf3;color:var(--muted)}.tabs button.active{background:var(--brand);color:white}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}.panel h2{font-size:17px;margin:0 0 14px}.filters{display:grid;grid-template-columns:1fr 150px;gap:9px;margin-bottom:14px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;background:white;color:var(--ink);min-height:110px}.product strong{display:block;margin:5px 0}.product small{color:var(--muted)}.price{color:var(--brand);font-weight:750}.cart-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:7px}.qty button{min-height:34px;padding:5px 10px}.qty span{min-width:18px;text-align:center}.muted{color:var(--muted);font-size:13px}.totals{margin-top:12px}.totalrow{display:flex;justify-content:space-between;margin:7px 0}.grand{font-size:19px;font-weight:800;border-top:1px solid var(--line);padding-top:12px}.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.pay .wide{grid-column:1/-1}.notice{padding:10px;border-radius:10px;background:#fff4d8;color:#8a5b00;margin-top:9px}.empty{text-align:center;color:var(--muted);padding:24px 8px}.section{display:none}.section.active{display:block}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}.history-card{padding:12px 0;border-bottom:1px solid var(--line)}.receipt{border:1px dashed #aaa;padding:16px;max-width:400px;background:#fff;margin:10px auto;font-family:monospace;color:#222}.receipt h3{text-align:center}.receipt .rline{display:flex;justify-content:space-between;gap:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px;display:flex;justify-content:center;gap:8px;z-index:5}.bottom button{flex:1;max-width:220px}.smallbtn{padding:7px 10px;min-height:34px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
@media(min-width:720px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding-top:24px}.bottom{display:none}}
@media(max-width:719px){.layout{grid-template-columns:1fr}.filters{grid-template-columns:1fr 125px}.panel{padding:13px}.cartpanel{order:2}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.top h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">🧾</div><div><h1>Kedai Rona</h1><p>Kasir sederhana • cepat & praktis</p></div></div><button class="secondary" id="themeBtn" aria-label="Ganti tema">☾</button></header>
<nav class="tabs" aria-label="Menu"><button class="active" data-tab="kasir">Kasir</button><button data-tab="produk">Kelola Produk</button><button data-tab="riwayat">Riwayat</button><button data-tab="laporan">Laporan</button></nav>
<section class="section active" id="kasir">
<div class="layout">
<div class="panel"><h2>Daftar Produk</h2><div class="filters"><input id="search" placeholder="Cari produk…" aria-label="Cari produk"><select id="category" aria-label="Filter kategori"><option value="">Semua kategori</option></select></div><div class="products" id="products"></div></div>
<div class="panel cartpanel"><div class="toolbar"><h2>Keranjang</h2><button class="danger smallbtn" id="clearCart">Kosongkan</button></div><div id="cart"></div><div class="totals"><div class="totalrow"><span>Subtotal</span><strong id="subtotal">Rp0</strong></div><div class="totalrow"><label for="discount">Diskon (Rp)</label><input id="discount" type="number" min="0" value="0" style="max-width:130px"></div><div class="totalrow"><span>PPN (0%)</span><strong>Rp0</strong></div><div class="totalrow grand"><span>Total</span><strong id="total">Rp0</strong></div></div>
<div class="pay"><div class="wide"><label for="paid">Uang dibayar (Rp)</label><input id="paid" type="number" min="0" placeholder="Masukkan nominal pembayaran"></div><div class="totalrow wide"><span>Kembalian</span><strong id="change">Rp0</strong></div><button class="wide" id="checkout">Selesaikan Transaksi</button><div id="paymentNotice" class="wide muted" role="status"></div></div>
</div></div></section>
<section class="section" id="produk"><div class="panel"><h2 id="formTitle">Tambah Produk</h2><form id="productForm" class="formgrid"><input type="hidden" id="editId"><div><label for="pname">Nama produk</label><input id="pname" required maxlength="70"></div><div><label for="pcat">Kategori</label><input id="pcat" required maxlength="40"></div><div><label for="pprice">Harga (Rp)</label><input id="pprice" type="number" min="1" required></div><div><label for="pstock">Stok</label><input id="pstock" type="number" min="0" value="20" required></div><button class="wide" type="submit">Simpan Produk</button><button class="wide secondary" type="button" id="cancelEdit" hidden>Batal mengubah</button></form><h2 style="margin-top:22px">Produk Tersimpan</h2><div class="tablewrap"><table><thead><tr><th>Produk</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="productRows"></tbody></table></div></div></section>
<section class="section" id="riwayat"><div class="panel"><h2>Riwayat Transaksi</h2><div id="history"></div></div></section>
<section class="section" id="laporan"><div class="panel"><h2>Laporan Penjualan Hari Ini</h2><div class="totalrow"><span>Total pendapatan</span><strong id="dailyRevenue">Rp0</strong></div><div class="totalrow"><span>Jumlah transaksi</span><strong id="dailyCount">0</strong></div></div></section>
<section class="section" id="struk"><div class="panel"><h2>Struk Transaksi</h2><div id="receipt"></div><button class="secondary" onclick="window.print()">Cetak struk</button></div></section>
</div>
<div class="bottom"><button data-tab="kasir">🛒 Kasir</button><button data-tab="produk">＋ Produk</button><button data-tab="riwayat">◷ Riwayat</button></div>
<script>
const KEY='kedaiRona.products', TXKEY='kedaiRona.transactions';
const seed=[['Air mineral 600 ml',4000,'Minuman',30],['Teh botol',5000,'Minuman',24],['Kopi sachet',2500,'Minuman',40],['Roti cokelat',6000,'Makanan',18],['Mi instan',3500,'Makanan',35],['Biskuit',7000,'Makanan',20],['Keripik kentang',8500,'Makanan',15],['Susu kotak',6500,'Minuman',20],['Pulpen biru',3000,'Alat tulis',25],['Buku tulis',5000,'Alat tulis',30],['Pensil 2B',2500,'Alat tulis',25],['Penghapus',2000,'Alat tulis',20]];
let products=JSON.parse(localStorage.getItem(KEY)||'null')||seed.map((p,i)=>({id:i+1,name:p[0],price:p[1],category:p[2],stock:p[3]}));
let transactions=JSON.parse(localStorage.getItem(TXKEY)||'[]'),cart={};
const $=id=>document.getElementById(id), rupiah=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
function save(){localStorage.setItem(KEY,JSON.stringify(products));localStorage.setItem(TXKEY,JSON.stringify(transactions))}
function cats(){let old=$('category').value;let c=[...new Set(products.map(p=>p.category))];$('category').innerHTML='<option value="">Semua kategori</option>'+c.map(x=>`<option>${esc(x)}</option>`).join('');$('category').value=old}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderProducts(){cats();let q=$('search').value.toLowerCase(),cat=$('category').value;let list=products.filter(p=>p.name.toLowerCase().includes(q)&&(!cat||p.category===cat));$('products').innerHTML=list.map(p=>`<button class="product" data-add="${p.id}" ${p.stock<=0?'disabled':''}><small>${esc(p.category)} · Stok ${p.stock}</small><strong>${esc(p.name)}</strong><span class="price">${rupiah(p.price)}</span></button>`).join('')||'<div class="empty">Produk tidak ditemukan.</div>';renderRows()}
function renderCart(){let entries=Object.entries(cart).filter(([id,n])=>n>0);$('cart').innerHTML=entries.map(([id,n])=>{let p=products.find(x=>x.id==id);if(!p)return '';return `<div class="cart-item"><div><strong>${esc(p.name)}</strong><div class="muted">${rupiah(p.price)} × ${n} = ${rupiah(p.price*n)}</div><button class="danger smallbtn" data-remove="${id}">Hapus</button></div><div class="qty"><button class="secondary" data-minus="${id}">−</button><span>${n}</span><button class="secondary" data-plus="${id}">+</button></div></div>`}).join('')||'<div class="empty">Keranjang masih kosong.</div>';let sub=entries.reduce((s,[id,n])=>s+products.find(p=>p.id==id).price*n,0),disc=Math.min(sub,Math.max(0,+$('discount').value||0)),total=sub-disc;$('subtotal').textContent=rupiah(sub);$('total').textContent=rupiah(total);let paid=Math.max(0,+$('paid').value||0);$('change').textContent=rupiah(Math.max(0,paid-total));$('checkout').disabled=!entries.length||paid<total;$('paymentNotice').textContent=entries.length&&paid<total?'Uang pembayaran masih kurang.':''}
function renderRows(){$('productRows').innerHTML=products.map(p=>`<tr><td>${esc(p.name)}<br><small>${esc(p.category)}</small></td><td>${rupiah(p.price)}</td><td>${p.stock}</td><td><button class="secondary smallbtn" data-edit="${p.id}">Ubah</button> <button class="danger smallbtn" data-delete="${p.id}">Hapus</button></td></tr>`).join('')}
function renderHistory(){$('history').innerHTML=transactions.slice().reverse().map(t=>`<div class="history-card"><strong>${new Date(t.date).toLocaleString('id-ID')}</strong><div class="muted">${t.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(', ')}</div><div class="totalrow"><span>Total ${rupiah(t.total)}</span><button class="secondary smallbtn" data-showreceipt="${t.id}">Lihat struk</button></div></div>`).join('')||'<div class="empty">Belum ada transaksi.</div>';let today=new Date().toDateString(),ts=transactions.filter(t=>new Date(t.date).toDateString()===today);$('dailyRevenue').textContent=rupiah(ts.reduce((a,t)=>a+t.total,0));$('dailyCount').textContent=ts.length}
function showReceipt(t){$('receipt').innerHTML=`<div class="receipt"><h3>KEDAI RONA</h3><p style="text-align:center">Struk Pembelian</p><hr><p>${new Date(t.date).toLocaleString('id-ID')}</p>${t.items.map(i=>`<div class="rline"><span>${esc(i.name)} ×${i.qty}</span><span>${rupiah(i.price*i.qty)}</span></div>`).join('')}<hr><div class="rline"><b>Total</b><b>${rupiah(t.total)}</b></div><div class="rline"><span>Bayar</span><span>${rupiah(t.paid)}</span></div><div class="rline"><span>Kembalian</span><span>${rupiah(t.change)}</span></div><p style="text-align:center">Terima kasih!</p></div>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(b.dataset.tab).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===b.dataset.tab));if(b.dataset.tab==='produk')renderRows();if(b.dataset.tab==='riwayat'||b.dataset.tab==='laporan')renderHistory()}));
$('products').addEventListener('click',e=>{let b=e.target.closest('[data-add]');if(!b)return;let id=b.dataset.add,p=products.find(x=>x.id==id);if(p&&((cart[id]||0)<p.stock))cart[id]=(cart[id]||0)+1;renderCart()});
$('cart').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let id=b.dataset.plus||b.dataset.minus||b.dataset.remove;if(b.dataset.plus){let p=products.find(x=>x.id==id);if(cart[id]<p.stock)cart[id]++}if(b.dataset.minus){cart[id]--;if(cart[id]<=0)delete cart[id]}if(b.dataset.remove)delete cart[id];renderCart()});
$('search').oninput=renderProducts;$('category').onchange=renderProducts;$('discount').oninput=renderCart;$('paid').oninput=renderCart;$('clearCart').onclick=()=>{if(confirm('Kosongkan semua isi keranjang?')){cart={};renderCart()}};
$('checkout').onclick=()=>{let items=Object.entries(cart).map(([id,qty])=>{let p=products.find(p=>p.id==id);return {id:p.id,name:p.name,price:p.price,qty}}),sub=items.reduce((s,i)=>s+i.price*i.qty,0),disc=Math.min(sub,Math.max(0,+$('discount').value||0)),total=sub-disc,paid=+$('paid').value;if(paid<total)return;if(!confirm('Selesaikan transaksi ini?'))return;items.forEach(i=>{let p=products.find(p=>p.id===i.id);p.stock-=i.qty});let t={id:Date.now(),date:new Date().toISOString(),items,subtotal:sub,discount:disc,total,paid,change:paid-total};transactions.push(t);save();cart={};$('paid').value='';$('discount').value='0';renderProducts();renderCart();renderHistory();showReceipt(t);document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$('struk').classList.add('active')};
$('productForm').onsubmit=e=>{e.preventDefault();let id=+$('editId').value,entry={id:id||Date.now(),name:$('pname').value.trim(),category:$('pcat').value.trim(),price:+$('pprice').value,stock:+$('pstock').value};if(!entry.name||!entry.category||entry.price<1||entry.stock<0)return;if(id)products=products.map(p=>p.id===id?entry:p);else products.push(entry);save();e.target.reset();$('editId').value='';$('formTitle').textContent='Tambah Produk';$('cancelEdit').hidden=true;renderProducts()};
$('productRows').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let id=+((b.dataset.edit)||(b.dataset.delete));if(b.dataset.edit){let p=products.find(p=>p.id===id);$('editId').value=p.id;$('pname').value=p.name;$('pcat').value=p.category;$('pprice').value=p.price;$('pstock').value=p.stock;$('formTitle').textContent='Ubah Produk';$('cancelEdit').hidden=false;window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.delete&&confirm('Hapus produk ini?')){products=products.filter(p=>p.id!==id);delete cart[id];save();renderProducts();renderCart()}});
$('cancelEdit').onclick=()=>{$('productForm').reset();$('editId').value='';$('formTitle').textContent='Tambah Produk';$('cancelEdit').hidden=true};
$('history').addEventListener('click',e=>{let b=e.target.closest('[data-showreceipt]');if(b){let t=transactions.find(t=>t.id==b.dataset.showreceipt);showReceipt(t);document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$('struk').classList.add('active')}});
$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');let d=document.body.classList.contains('dark');document.documentElement.style.setProperty('--bg',d?'#171827':'#f6f7fb');document.documentElement.style.setProperty('--card',d?'#222438':'#fff');document.documentElement.style.setProperty('--ink',d?'#f4f4ff':'#20243a');document.documentElement.style.setProperty('--line',d?'#393b52':'#e8e9f1');document.querySelectorAll('input,select,.product').forEach(x=>{x.style.background=d?'#292c42':'';x.style.color=d?'#f4f4ff':''})};
renderProducts();renderCart();renderHistory();
</script>
</body></html>
